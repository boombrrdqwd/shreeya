<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For The Most Special Girl ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
      color: white;
    }

    /* Soft glowing background */
    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      filter: blur(80px);
      animation: glow 5s infinite alternate;
    }

    @keyframes glow {
      from { transform: scale(0.8); }
      to { transform: scale(1.3); }
    }

    .card {
      position: relative;
      z-index: 5;
      width: min(90%, 720px);
      padding: 45px 35px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: appear 1.5s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .heart {
      font-size: 70px;
      animation: heartbeat 1.3s infinite;
      margin-bottom: 15px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      margin-bottom: 15px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .message {
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.9;
      min-height: 180px;
    }

    .highlight {
      color: #fff4a3;
      font-weight: bold;
    }

    .question {
      margin-top: 25px;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: bold;
      animation: pulseText 2s infinite;
    }

    @keyframes pulseText {
      50% {
        transform: scale(1.04);
        text-shadow: 0 0 20px rgba(255,255,255,0.7);
      }
    }

    button {
      margin-top: 25px;
      padding: 15px 35px;
      border: none;
      border-radius: 50px;
      background: white;
      color: #e84375;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    /* Floating hearts */
    .floating-heart {
      position: fixed;
      bottom: -50px;
      font-size: 25px;
      pointer-events: none;
      animation: floatUp linear forwards;
      opacity: 0.8;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 30px 20px;
        border-radius: 24px;
      }

      .heart {
        font-size: 55px;
      }

      .message {
        line-height: 1.7;
      }

      button {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>

    <h1>For You, My Special One</h1>

    <div class="subtitle">
      There is something my heart has been wanting to tell you...
    </div>

    <p class="message" id="message"></p>

    <div class="question">
      Will you be mine? 💍❤️
    </div>

    <button onclick="celebrate()">
      💖 Yes, With All My Heart
    </button>
  </div>

  <script>
    const text = `You are not just someone special in my life; you have become
    one of the most beautiful reasons behind my smiles, my happiness, and my
    dreams. Every moment I spend with you feels more precious than words can
    explain. You have shown me a kind of happiness I never knew I was missing,
    and somehow, you make even ordinary days feel magical. I don't want to
    promise you a perfect life, because life will always have its ups and
    downs, but I promise that I will stand beside you, value you, respect you,
    listen to you, and choose you again and again. I want to be there for your
    happiest moments, your difficult days, your dreams, and everything in
    between. You are incredibly <span class="highlight">important and valuable
    to me</span>, and if my heart could speak, it would simply say one thing:
    I want you in my life, today, tomorrow, and for all the beautiful days
    waiting for us. ❤️`;

    const message = document.getElementById("message");
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        message.innerHTML = text.substring(0, i + 1);
        i++;
        setTimeout(typeWriter, 25);
      }
    }

    typeWriter();

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerHTML = ["❤️", "💕", "💖", "💗", "💘"][Math.floor(Math.random() * 5)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 5) + "s";
      heart.style.fontSize = (18 + Math.random() * 25) + "px";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 500);

    // Confetti celebration
    function celebrate() {
      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");

        confetti.style.position = "fixed";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.width = "10px";
        confetti.style.height = "10px";
        confetti.style.backgroundColor =
          ["#ff1744", "#ffeb3b", "#ffffff", "#e91e63", "#00e5ff"][
            Math.floor(Math.random() * 5)
          ];

        confetti.style.zIndex = "9999";
        confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        const duration = 2000 + Math.random() * 3000;

        confetti.animate(
          [
            {
              transform: `translate(0, 0) rotate(0deg)`,
              opacity: 1
            },
            {
              transform:
                `translate(${(Math.random() - 0.5) * 300}px,
                 ${window.innerHeight + 100}px)
                 rotate(${Math.random() * 1000}deg)`,
              opacity: 0
            }
          ],
          {
            duration: duration,
            easing: "cubic-bezier(.2,.8,.3,1)"
          }
        );

        setTimeout(() => confetti.remove(), duration);
      }

      document.querySelector(".question").innerHTML =
        "You just made my heart the happiest! ❤️🥹";
    }
  </script>

</body>
</html>
